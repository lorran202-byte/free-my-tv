name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: '17' }
      - run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "build-tools;34.0.0" "platforms;android-34" > /dev/null
      - run: ./build.sh
      - uses: actions/upload-artifact@v5
        with: { name: FreeMyTV-apk, path: FreeMyTV.apk }
      - name: Publish APK to branch apk
        run: |
          mkdir pub && cp FreeMyTV.apk pub/ && cd pub
          git init -q -b apk && git add FreeMyTV.apk
          git -c user.name=bot -c user.email=bot@users.noreply.github.com commit -qm "APK"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}" apk
